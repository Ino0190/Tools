    <path d="M654 290 H708 Q722 290 728 304 L744 334 V358 H654 Z" fill="#21537f" stroke="#162a42" stroke-width="3" stroke-linejoin="round"/>
    <path d="M668 300 H704 Q712 300 716 308 L726 326 H668 Z" fill="#9fc0dd" stroke="#162a42" stroke-width="3" stroke-linejoin="round"/>
    <rect x="484" y="278" width="150" height="34" fill="#c62828"/>
    <circle cx="512" cy="362" r="22" fill="#121212"/>
    <circle cx="512" cy="362" r="9" fill="#a0aec0"/>
    <circle cx="700" cy="362" r="22" fill="#121212"/>
    <circle cx="700" cy="362" r="9" fill="#a0aec0"/>
  </g>
  <g data-layer="矢印">
    <path d="M430 210 C 500 170, 580 175, 640 215" fill="none" stroke="#c62828" stroke-width="5" stroke-linecap="round"/>
